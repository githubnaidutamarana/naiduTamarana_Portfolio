[build]
  command = "npm run build"
  publish = "dist/portfolio/browser"

[build.environment]
  NODE_VERSION = "22"

# Angular SPA: serve index.html for client-side routes
# (/projects/:slug, /demos/:slug) so deep links and refreshes don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
